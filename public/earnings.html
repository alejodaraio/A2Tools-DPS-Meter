<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Earnings</title>
    <!--
      The Earnings widget (label "earnings", a Hub widget): kinah and Abyss
      Points earned, from `get_earnings`. A page of its own like radar.html,
      transparent around its panel.
    -->
    <style>
      :root {
        --panel: rgba(10, 14, 22, 0.82);
        --line: rgba(255, 255, 255, 0.12);
        --text: rgba(255, 255, 255, 0.88);
        --muted: rgba(255, 255, 255, 0.5);
        --kinah: #ffcc33;
        --ap: #c77dff;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: transparent;
        color: var(--text);
        font: 12px/1.35 "Pretendard Variable", "Segoe UI", system-ui, sans-serif;
        overflow: hidden;
        user-select: none;
      }
      .panel {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        overflow: hidden;
      }
      .header {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 4px 6px 4px 10px;
        border-bottom: 1px solid var(--line);
        cursor: move;
      }
      .title { flex: 1; font-weight: 600; letter-spacing: 0.02em; }
      .since { color: var(--muted); font-size: 11px; margin-right: 2px; }
      .btn {
        border: 1px solid transparent;
        background: none;
        color: var(--muted);
        font: inherit;
        font-size: 11px;
        padding: 1px 5px;
        border-radius: 5px;
        cursor: pointer;
      }
      .btn:hover { color: #fff; border-color: var(--line); }
      .rows {
        flex: 1;
        display: grid;
        grid-template-columns: auto auto 1fr;
        align-content: center;
        column-gap: 10px;
        row-gap: 3px;
        padding: 6px 10px;
      }
      .label { font-weight: 600; }
      .label.kinah { color: var(--kinah); }
      .label.ap { color: var(--ap); }
      .value { font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
      .rate { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .waiting { grid-column: 1 / -1; color: var(--muted); }
    </style>
  </head>
  <body>
    <div class="panel">
      <div class="header">
        <span class="title">Earnings</span>
        <span class="since" id="since"></span>
        <button class="btn" id="resetBtn" title="Count from zero again">↺</button>
        <button class="btn" id="closeBtn" title="Close">✕</button>
      </div>
      <div class="rows" id="rows"></div>
    </div>
    <script src="/src/js/earnings.js"></script>
  </body>
</html>
