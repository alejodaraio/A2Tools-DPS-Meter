<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Abyss Hub: an abyss rift (the ring) with the widgets around its hub. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141a33"/>
      <stop offset="1" stop-color="#07080f"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7fd0ff"/>
      <stop offset="0.5" stop-color="#7a6bff"/>
      <stop offset="1" stop-color="#c04dff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.55" stop-color="#6a5cff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#6a5cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#2a1f5c"/>
      <stop offset="1" stop-color="#05050c"/>
    </radialGradient>
  </defs>
  <rect x="32" y="32" width="960" height="960" rx="210" fill="url(#bg)"/>
  <rect x="32" y="32" width="960" height="960" rx="210" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="6"/>
  <circle cx="512" cy="512" r="380" fill="url(#glow)"/>
  <circle cx="512" cy="512" r="262" fill="url(#core)"/>
  <circle cx="512" cy="512" r="262" fill="none" stroke="url(#ring)" stroke-width="72"/>
  <!-- the hub and its three widgets -->
  <g stroke="#cfe6ff" stroke-opacity="0.55" stroke-width="20" stroke-linecap="round">
    <line x1="512" y1="512" x2="512" y2="374"/>
    <line x1="512" y1="512" x2="392" y2="581"/>
    <line x1="512" y1="512" x2="632" y2="581"/>
  </g>
  <circle cx="512" cy="512" r="58" fill="#ffffff"/>
  <circle cx="512" cy="360" r="40" fill="#7fd0ff"/>
  <circle cx="380" cy="588" r="40" fill="#ffcc33"/>
  <circle cx="644" cy="588" r="40" fill="#3ddc84"/>
</svg>
